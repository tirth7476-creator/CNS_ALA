<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ALA PDF Viewer</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #111827;
      --surface-alt: #1f2937;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --shadow: 0 18px 35px rgba(15, 23, 42, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #1e293b 0%, #0f172a 45%, #020617 100%);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
    }

    .page {
      width: min(100%, 980px);
      display: grid;
      gap: 24px;
    }

    header {
      padding: 28px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.12);
      border-radius: 24px;
      box-shadow: var(--shadow);
    }

    header h1 {
      font-size: clamp(2rem, 2.5vw, 3rem);
      margin-bottom: 10px;
      letter-spacing: -0.05em;
    }

    header p {
      color: var(--muted);
      line-height: 1.7;
      max-width: 720px;
    }

    .cards {
      display: grid;
      gap: 18px;
    }

    .card {
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(148, 163, 184, 0.12);
      border-radius: 20px;
      padding: 26px;
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .card h2 {
      font-size: 1.35rem;
      margin-bottom: 0.25rem;
    }

    .card span {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 24px;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      border-radius: 999px;
      font-weight: 600;
      transition: background 0.2s ease, transform 0.2s ease;
      white-space: nowrap;
    }

    .button:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    @media (max-width: 640px) {
      .card {
        flex-direction: column;
        align-items: stretch;
      }

      .button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <h1>Kanada Tirth</h1>
      <p>Enrollment: 240905091020</p>
      
    </header>

    <section class="cards">
      <article class="card">
        <div>
          <h2>ALA 1</h2>
          <span>Assignment 1 PDF</span>
        </div>
        <a class="button" href="https://drive.google.com/file/d/1bhZJTFjWhhIWjmP2UVkHfyFmcNhPmLS-/view?usp=sharing" target="_blank" rel="noreferrer">Open PDF</a>
      </article>

      <article class="card">
        <div>
          <h2>ALA 2</h2>
          <span>Assignment 2 PDF</span>
        </div>
        <a class="button" href="https://drive.google.com/file/d/1q0QZ_V8RSsb-TQUfVBaGsCr8ylDiJYC8/view?usp=sharing" target="_blank" rel="noreferrer">Open PDF</a>
      </article>

      <article class="card">
        <div>
          <h2>ALA 3</h2>
          <span>Assignment 3 PDF</span>
        </div>
        <a class="button" href="https://drive.google.com/file/d/1nSireVeLvKEUbaf8YEdI-OZwWHD9Dz7N/view?usp=sharing" target="_blank" rel="noreferrer">Open PDF</a>
      </article>
    </section>
  </main>
</body>
</html>
